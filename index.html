<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Mirror - COMPUTEX Taipei 2026 V42</title>
    
    <!-- 基礎架構載入：採用穩定線上 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* 強制 100% 高度，解決 43 吋直立螢幕高度塌陷問題 */
        html, body, #root { 
            height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #000;
        }
        body { 
            color: #fff; font-family: "Microsoft JhengHei", "Arial Black", sans-serif; -webkit-user-select: none; 
        }
        
        /* Android 11 啟動授權層 */
        #wake-up-overlay {
            position: fixed; inset: 0; 
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            z-index: 99999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
            transition: opacity 0.8s ease;
        }
        .start-ring {
            width: 150px; height: 150px; border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4); display: flex; 
            align-items: center; justify-content: center;
            animation: ring-pulse 3s infinite;
        }
        @keyframes ring-pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 0.2; } 100% { transform: scale(1); opacity: 0.8; } }

        /* 全螢幕安全容器：留出四周物理邊框安全間距 */
        .global-safe-container {
            width: 100vw; height: 100%; 
            display: flex; flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 50px 40px 40px 40px; 
        }
        
        .glass-panel { 
            background: rgba(15, 15, 15, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 20px; padding: 12px; 
        }

        /* 影片播放容器：自適應撐開中間高度 */
        .video-container-max {
            width: 100%;
            flex: 1; 
            margin: 15px 0;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            position: relative;
        }
        .video-overlay { position: absolute; inset: 0; z-index: 10; }

        /* 跑馬燈安全區域：避開底部外框遮擋 */
        .marquee-safe-box {
            width: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(255,255,255,0.05) 50%, rgba(0,0,0,0) 100%);
            padding: 15px 0;
            margin: 10px 0;
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }

        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .animate-marquee { display: flex; white-space: nowrap; animation: marquee 45s linear infinite; }
        
        .btn-mirror { border: 1.5px solid rgba(255, 255, 255, 0.1); transition: 0.2s; cursor: pointer; }
        .btn-active { background: #fff !important; color: #000 !important; box-shadow: 0 0 30px rgba(255,255,255,0.3); }
        
        * { -webkit-tap-highlight-color: transparent; }
    </style>
    
    <script>
        // 建立全域代理函數，確保 HTML 中的 onclick 隨時可用，避免因 Babel Standalone 非同步編譯未完成而拋出 ReferenceError
        window.bootSystem = function() {
            if (typeof window._bootSystemImpl === 'function') {
                window._bootSystemImpl();
            } else {
                console.warn("系統仍在初始化編譯，請稍候點擊。");
            }
        };
    </script>
</head>
<body class="h-full">
    <!-- 引導層：解鎖 Android 11 媒體自動播放限制 -->
    <div id="wake-up-overlay" onclick="bootSystem()">
        <div id="loading-hint" style="color: #444; font-size: 14px; margin-bottom: 20px;">LAUNCHING COMPUTEX EXPERIENCE...</div>
        <div class="start-ring" id="start-btn" style="display: none;">
            <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><path d="M5 3l14 9-14 9V3z"/></svg>
        </div>
        <p id="boot-text" style="display: none; margin-top: 30px; letter-spacing: 0.8em; font-weight: bold; font-size: 16px; color: #fff;">COMPUTEX 2026</p>
    </div>

    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        let globalAudio = null;
        const FALLBACK_MUSIC = 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';

        // 系統載入監控：確保 React 與 Lucide 庫完全加載後才顯示點擊按鈕
        const checkReady = setInterval(() => {
            if (typeof React !== 'undefined' && typeof lucide !== 'undefined') {
                document.getElementById('loading-hint').style.display = 'none';
                document.getElementById('start-btn').style.display = 'flex';
                document.getElementById('boot-text').style.display = 'block';
                clearInterval(checkReady);
            }
        }, 500);

        // 將實際的啟動邏輯註冊到代理對象上
        window._bootSystemImpl = async function() {
            try {
                // 嘗試加載並解鎖本地背景音樂
                globalAudio = new Audio('./bg_music.mp3');
                globalAudio.loop = true;
                globalAudio.onerror = () => { globalAudio.src = FALLBACK_MUSIC; };
                await globalAudio.play();
                globalAudio.pause();
            } catch (e) { console.warn("Audio bypass."); }

            // 淡出啟動遮罩，進入主介面
            document.getElementById('wake-up-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('wake-up-overlay').style.display = 'none';
                renderApp();
            }, 800);
        };

        function App() {
            const [lang, setLang] = useState('tw');
            const [time, setTime] = useState(new Date());
            const [lightOn, setLightOn] = useState(false);
            const [musicOn, setMusicOn] = useState(false);

            // --- COMPUTEX 2026 國際商務語言資料庫 ---
            const DATA = {
                tw: {
                    welcome: "歡迎蒞臨 COMPUTEX 2026 | PERSONA 智慧魔鏡展位",
                    location: "南港展覽館 2 館 1 樓 | 展位 Q0829",
                    visitorsLabel: "累積展期人流",
                    uptimeLabel: "系統持續運作",
                    marquee: [
                        "歡迎蒞臨 COMPUTEX 2026 PERSONA 展位 Q0829，共同開啟未來零售新篇章！",
                        "PERSONA 4K 智慧魔鏡：支援 10 點電容觸控、Android 11 系統，專為頂級商務展示量身打造。",
                        "現場每日定時舉辦 Live Demo 產品發表，歡迎洽詢現場工作人員獲取詳細規格。",
                        "全球代理商與經銷商招募中，誠邀各界合作夥伴洽談 ODM / OEM 專案與客製化合作。"
                    ],
                    items: [
                        {t:"11:00 am", v:"智慧零售魔鏡 Live 發表會"},
                        {t:"14:00 pm", v:"AI 互動智慧系統展示"},
                        {t:"16:00 pm", v:"現場技術合作洽談會"}
                    ]
                },
                en: {
                    welcome: "Welcome to COMPUTEX 2026 | PERSONA Smart Mirror",
                    location: "TaiNEX Hall 2, 1F | Booth Q0829",
                    visitorsLabel: "TOTAL VISITORS",
                    uptimeLabel: "SYSTEM UPTIME",
                    marquee: [
                        "Welcome to PERSONA Booth Q0829 at COMPUTEX 2026! Let's shape the future of retail together!",
                        "PERSONA 4K Smart Mirror: Featuring 10-point capacitive touch, powered by Android 11, tailored for premium business.",
                        "Live Product Demos held daily. Scan or contact our onsite team for full specifications and partnerships.",
                        "Global distributors & partners wanted. Welcome to discuss ODM/OEM projects and custom integrations."
                    ],
                    items: [
                        {t:"11:00 am", v:"Smart Retail Mirror Live Demo"},
                        {t:"14:00 pm", v:"AI Interactive Tech Show"},
                        {t:"16:00 pm", v:"Business & Tech Matchmaking"}
                    ]
                }
            };

            const t = DATA[lang];

            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                if (window.lucide) lucide.createIcons();
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                if (window.lucide) lucide.createIcons();
            }, [lang, musicOn, lightOn]);

            const handleMusic = () => {
                if (!globalAudio) globalAudio = new Audio(FALLBACK_MUSIC);
                const next = !musicOn; setMusicOn(next);
                if (next) globalAudio.play().catch(() => setMusicOn(false));
                else globalAudio.pause();
            };

            const hhmm = time.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });
            const dateStr = time.toLocaleDateString(lang==='tw'?'zh-TW':'en-US', { month: 'short', day: 'numeric', weekday: 'short' });

            return (
                <div className="global-safe-container">
                    
                    {/* 1. HEADER (放大 Logo + 右上角防切邊時鐘與 COMPUTEX 行程) */}
                    <div className="flex justify-between items-start">
                        <div className="flex flex-col">
                            <div className="flex items-center gap-6">
                                {/* 放大後的 Logo (不帶重複文字) */}
                                <div className="h-32 w-32 flex items-center justify-center">
                                    <img src="./logo.png" className="h-full w-full object-contain" onError={(i) => i.target.src = 'https://cdn-icons-png.flaticon.com/512/3059/3059518.png'} />
                                </div>
                            </div>
                            <div className="flex items-center gap-3 mt-6 opacity-40">
                                <i data-lucide="map-pin" className="w-5 h-5"></i>
                                <span className="text-lg font-light uppercase tracking-[0.2em]">{t.location}</span>
                            </div>
                        </div>
                        
                        {/* 時鐘區域：內縮 pr-16 確保物理黑框不遮擋 */}
                        <div className="flex flex-col items-end pr-16">
                            <h1 className="text-8xl font-thin leading-none tracking-tighter text-white opacity-80">{hhmm}</h1>
                            <p className="text-2xl font-light text-gray-500 mt-2 tracking-[0.1em] uppercase mb-6">{dateStr}</p>
                            
                            {/* 右上角：COMPUTEX 現場發表行程 */}
                            <div className="glass-panel w-[260px] text-right">
                                <div className="text-[9px] font-black tracking-widest border-b border-white/5 pb-2 mb-2 text-blue-500 uppercase italic">Show Schedule</div>
                                <div className="flex flex-col gap-2">
                                    {t.items.map((it, i) => (
                                        <div key={i} className="flex flex-col border-r-3 border-white/40 pr-4">
                                            <span className="text-[13px] font-bold text-white/90">{it.v}</span>
                                            <span className="text-[10px] font-mono text-gray-500">{it.t}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 2. WELCOME BANNER (中英雙語 COMPUTEX 歡迎標語) */}
                    <div className="mt-2 mb-2 border-l-4 border-white/20 pl-8 py-3 bg-white/5 rounded-r-3xl">
                        <div className="text-2xl font-light text-white/90 tracking-[0.3em] uppercase">
                            {t.welcome}
                        </div>
                    </div>

                    {/* 3. VIDEO AREA (核心 5 片 YouTube 帶音訊輪播) */}
                    <div className="video-container-max">
                        <div className="video-overlay"></div>
                        <iframe 
                            className="w-full h-full border-none"
                            src="https://www.youtube-nocookie.com/embed/XnjQNAigtYE?autoplay=1&mute=0&loop=1&playlist=XnjQNAigtYE,mAbcJRE48VY,n2qsqUDseYI,liuk0tEsOEM,GdKKJTlKUkE&controls=0&modestbranding=1&rel=0&iv_load_policy=3&enablejsapi=1&origin=https://www.youtube.com"
                            allow="autoplay; encrypted-media" 
                            allowFullScreen
                        ></iframe>
                    </div>

                    {/* 4. MARQUEE AREA (安全上移：中英 COMPUTEX 動態跑馬燈) */}
                    <div className="marquee-safe-box">
                        <div className="animate-marquee">
                            {t.marquee.map((m, i) => (
                                <div key={i} className="flex items-center">
                                    <span className="text-2xl font-light text-white tracking-[0.1em] px-12 italic">{m}</span>
                                    <i data-lucide="sparkles" className="w-6 h-6 text-blue-400 opacity-60"></i>
                                </div>
                            ))}
                            {t.marquee.map((m, i) => (
                                <div key={`rep-${i}`} className="flex items-center">
                                    <span className="text-2xl font-light text-white tracking-[0.1em] px-12 italic">{m}</span>
                                    <i data-lucide="sparkles" className="w-6 h-6 text-blue-400 opacity-60"></i>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* 5. BOTTOM CONTROLS & STATS (精簡控制按鈕 + 展會商務指標數據) */}
                    <div className="flex flex-col gap-8">
                        <div className="flex justify-between items-end">
                            {/* 燈光與音樂按鈕 */}
                            <div className="glass-panel flex gap-6 px-10 py-6">
                                <button onClick={() => setLightOn(!lightOn)} className={`w-20 h-20 btn-mirror rounded-[20px] flex flex-col items-center justify-center gap-2 ${lightOn ? 'btn-active shadow-xl' : 'text-white/30'}`}>
                                    <i data-lucide="lightbulb" className="w-8 h-8"></i>
                                    <span className="text-[9px] font-black uppercase">Light</span>
                                </button>
                                <button onClick={handleMusic} className={`w-20 h-20 btn-mirror rounded-[20px] flex flex-col items-center justify-center gap-2 ${musicOn ? 'btn-active bg-cyan-600' : 'text-white/30'}`}>
                                    <i data-lucide={musicOn ? "pause" : "play"} className="w-8 h-8"></i>
                                    <span className="text-[9px] font-black uppercase">Music</span>
                                </button>
                            </div>

                            {/* 語言切換按鈕區 */}
                            <div className="flex gap-3 glass-panel p-4">
                                {['tw', 'en'].map(c => (
                                    <button 
                                        key={c} onClick={() => setLang(c)}
                                        className={`px-6 py-2 border font-black text-sm rounded-[10px] transition-all ${lang === c ? 'bg-white text-black shadow-lg' : 'border-white/10 text-white/30'}`}
                                    >
                                        {c.toUpperCase()}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 最底部：COMPUTEX 展場商務數據指標 */}
                        <div className="flex justify-center gap-20 opacity-30">
                            <div className="text-center">
                                <div className="text-2xl font-light text-emerald-400">12,480</div>
                                <div className="text-[7px] text-gray-500 uppercase tracking-widest">{t.visitorsLabel}</div>
                            </div>
                            <div className="text-center">
                                <div className="text-3xl font-light text-indigo-400">100%</div>
                                <div className="text-[7px] text-gray-500 uppercase tracking-widest">{t.uptimeLabel}</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function renderApp() {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        }
    </script>
</body>
</html>
