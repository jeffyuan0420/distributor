<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Mirror - COMPUTEX Taipei 2026 V44 (Anti-Glare & High Contrast)</title>
    
    <!-- 基礎架構載入：採用穩定線上 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* 強制 100% 高度，解決 43 吋直立螢幕高度塌陷問題 */
        html, body, #root { 
            height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #000;
        }
        body { 
            color: #fff; font-family: "Microsoft JhengHei", "Arial Black", sans-serif; -webkit-user-select: none; 
        }
        
        /* Android 11 啟動授權層 */
        #wake-up-overlay {
            position: fixed; inset: 0; 
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            z-index: 99999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
            transition: opacity 0.8s ease;
        }
        .start-ring {
            width: 150px; height: 150px; border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4); display: flex; 
            align-items: center; justify-content: center;
            animation: ring-pulse 3s infinite;
        }
        @keyframes ring-pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 0.2; } 100% { transform: scale(1); opacity: 0.8; } }

        /* 全螢幕安全容器：留出四周物理邊框安全間距 */
        .global-safe-container {
            width: 100vw; height: 100%; 
            display: flex; flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 50px 40px 40px 40px; 
        }
        
        /* 強化防眩玻璃面板：提高暗度，阻擋背景高光反射 */
        .glass-panel { 
            background: rgba(0, 0, 0, 0.88); /* 提升至 88% 不透明度以吸收折射光 */
            border: 2px solid rgba(255, 255, 255, 0.25); /* 強化邊界線條 */
            border-radius: 20px; padding: 14px; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
        }

        /* 影片播放容器 */
        .video-container-max {
            width: 100%;
            flex: 1; 
            margin: 15px 0;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            position: relative;
        }
        .video-overlay { position: absolute; inset: 0; z-index: 10; }

        /* 核心修復：抗展場高反射黑輪廓陰影 */
        .mirror-text-glow {
            text-shadow: 
                0px 0px 8px rgba(0, 0, 0, 1), 
                0px 0px 15px rgba(0, 0, 0, 1), 
                0px 0px 3px rgba(0, 0, 0, 1);
        }

        /* 跑馬燈安全區域 */
        .marquee-safe-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.85); /* 強化底色對比 */
            padding: 15px 0;
            margin: 10px 0;
            border-top: 2px solid rgba(255, 255, 255, 0.15);
            border-bottom: 2px solid rgba(255, 255, 255, 0.15);
            overflow: hidden;
        }

        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .animate-marquee { display: flex; white-space: nowrap; animation: marquee 45s linear infinite; }
        
        /* 💡 現場高可視度實心按鈕樣式 */
        .btn-mirror-inactive-ctrl {
            background-color: #121212 !important;
            border: 3px solid #10b981 !important;
            color: #10b981 !important;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
        }
        .btn-mirror-active-ctrl {
            background-color: #10b981 !important;
            border: 3px solid #10b981 !important;
            color: #000000 !important;
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.8);
        }
        
        .btn-mirror-inactive-lang {
            background-color: #121212 !important;
            border: 3px solid #22d3ee !important;
            color: #22d3ee !important;
            box-shadow: 0 4px 15px rgba(34, 211, 238, 0.2);
        }
        .btn-mirror-active-lang {
            background-color: #22d3ee !important;
            border: 3px solid #22d3ee !important;
            color: #000000 !important;
            box-shadow: 0 0 40px rgba(34, 211, 238, 0.8);
        }
        
        .btn-mirror { transition: all 0.15s ease-out; cursor: pointer; }
        .btn-mirror:active { transform: scale(0.92); }
        
        * { -webkit-tap-highlight-color: transparent; }
    </style>
    
    <script>
        // 建立全域代理函數，確保 HTML 中的 onclick 隨時可用
        window.bootSystem = function() {
            if (typeof window._bootSystemImpl === 'function') {
                window._bootSystemImpl();
            } else {
                console.warn("系統仍在初始化編譯，請稍候點擊。");
            }
        };
    </script>
</head>
<body class="h-full">
    <!-- 引導層：解鎖 Android 11 媒體自動播放限制 -->
    <div id="wake-up-overlay" onclick="bootSystem()">
        <div id="loading-hint" style="color: #666; font-size: 14px; margin-bottom: 20px; font-weight: bold;">INITIALIZING HIGH-CONTRAST INTERFACE...</div>
        <div class="start-ring" id="start-btn" style="display: none;">
            <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M5 3l14 9-14 9V3z"/></svg>
        </div>
        <p id="boot-text" style="display: none; margin-top: 30px; letter-spacing: 0.8em; font-weight: bold; font-size: 18px; color: #fff;">COMPUTEX 2026</p>
    </div>

    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        let globalAudio = null;
        const FALLBACK_MUSIC = 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';

        // 系統載入監控
        const checkReady = setInterval(() => {
            if (typeof React !== 'undefined' && typeof lucide !== 'undefined') {
                document.getElementById('loading-hint').style.display = 'none';
                document.getElementById('start-btn').style.display = 'flex';
                document.getElementById('boot-text').style.display = 'block';
                clearInterval(checkReady);
            }
        }, 500);

        // 將實際的啟動邏輯註冊到代理對象上
        window._bootSystemImpl = async function() {
            try {
                // 嘗試加載並解鎖本地背景音樂
                globalAudio = new Audio('./bg_music.mp3');
                globalAudio.loop = true;
                globalAudio.onerror = () => { globalAudio.src = FALLBACK_MUSIC; };
                await globalAudio.play();
                globalAudio.pause();
            } catch (e) { console.warn("Audio bypass."); }

            // 淡出啟動遮罩，進入主介面
            document.getElementById('wake-up-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('wake-up-overlay').style.display = 'none';
                renderApp();
            }, 800);
        };

        function App() {
            const [lang, setLang] = useState('tw');
            const [time, setTime] = useState(new Date());
            const [lightOn, setLightOn] = useState(false);
            const [musicOn, setMusicOn] = useState(false);

            // --- COMPUTEX 2026 國際商務語言資料庫 ---
            const DATA = {
                tw: {
                    welcome: "歡迎蒞臨 COMPUTEX 2026 | PERSONA 智慧魔鏡展位",
                    location: "南港展覽館 2 館 1 樓 | 展位 Q0829",
                    visitorsLabel: "累積展期人流 TOTAL VISITORS",
                    uptimeLabel: "系統持續運作 SYSTEM UPTIME",
                    marquee: [
                        "歡迎蒞臨 COMPUTEX 2026 PERSONA 展位 Q0829，共同開啟未來零售新篇章！",
                        "PERSONA 4K 智慧魔鏡：支援 10 點電容觸控、Android 11 系統，專為頂級商務展示量身打造。",
                        "現場每日定時舉辦 Live Demo 產品發表，歡迎洽詢現場工作人員獲取詳細規格。",
                        "全球代理商與經銷商招募中，誠邀各界合作夥伴洽談 ODM / OEM 專案與客製化合作。"
                    ],
                    items: [
                        {t:"11:00 am", v:"智慧零售魔鏡 Live 發表會"},
                        {t:"14:00 pm", v:"AI 互動智慧系統展示"},
                        {t:"16:00 pm", v:"現場技術合作洽談會"}
                    ]
                },
                en: {
                    welcome: "Welcome to COMPUTEX 2026 | PERSONA Smart Mirror",
                    location: "TaiNEX Hall 2, 1F | Booth Q0829",
                    visitorsLabel: "TOTAL VISITORS",
                    uptimeLabel: "SYSTEM UPTIME",
                    marquee: [
                        "Welcome to PERSONA Booth Q0829 at COMPUTEX 2026! Let's shape the future of retail together!",
                        "PERSONA 4K Smart Mirror: Featuring 10-point capacitive touch, powered by Android 11, tailored for premium business.",
                        "Live Product Demos held daily. Scan or contact our onsite team for full specifications and partnerships.",
                        "Global distributors & partners wanted. Welcome to discuss ODM/OEM projects and custom integrations."
                    ],
                    items: [
                        {t:"11:00 am", v:"Smart Retail Mirror Live Demo"},
                        {t:"14:00 pm", v:"AI Interactive Tech Show"},
                        {t:"16:00 pm", v:"Business & Tech Matchmaking"}
                    ]
                }
            };

            const t = DATA[lang];

            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                if (window.lucide) lucide.createIcons();
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                if (window.lucide) lucide.createIcons();
            }, [lang, musicOn, lightOn]);

            const handleMusic = () => {
                if (!globalAudio) globalAudio = new Audio(FALLBACK_MUSIC);
                const next = !musicOn; setMusicOn(next);
                if (next) globalAudio.play().catch(() => setMusicOn(false));
                else globalAudio.pause();
            };

            const hhmm = time.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });
            const dateStr = time.toLocaleDateString(lang==='tw'?'zh-TW':'en-US', { month: 'short', day: 'numeric', weekday: 'short' });

            return (
                <div className="global-safe-container">
                    
                    {/* 1. HEADER (放大 Logo + 右上角防切邊時鐘與 COMPUTEX 行程) */}
                    <div className="flex justify-between items-start">
                        <div className="flex flex-col">
                            <div className="flex items-center gap-6">
                                {/* 放大後的 Logo */}
                                <div className="h-32 w-32 flex items-center justify-center bg-black/40 rounded-xl p-1 border border-white/10">
                                    <img src="./logo.png" className="h-full w-full object-contain" onError={(i) => i.target.src = 'https://cdn-icons-png.flaticon.com/512/3059/3059518.png'} />
                                </div>
                            </div>
                            {/* 強化對比度的展位地址 */}
                            <div className="flex items-center gap-3 mt-6 text-white font-bold mirror-text-glow">
                                <i data-lucide="map-pin" className="w-6 h-6 text-cyan-400"></i>
                                <span className="text-xl font-bold uppercase tracking-[0.2em]">{t.location}</span>
                            </div>
                        </div>
                        
                        {/* 時鐘區域：內縮 pr-16 確保物理黑框不遮擋，並全面強化粗體與黑陰影 */}
                        <div className="flex flex-col items-end pr-16">
                            <h1 className="text-8xl font-black text-white tracking-tighter leading-none mirror-text-glow">
                                {hhmm}
                            </h1>
                            <p className="text-3xl font-bold text-yellow-300 mt-3 tracking-[0.1em] uppercase mb-6 mirror-text-glow">
                                {dateStr}
                            </p>
                            
                            {/* 右上角：COMPUTEX 現場發表行程 */}
                            <div className="glass-panel w-[280px] text-right">
                                <div className="text-xs font-black tracking-widest border-b border-cyan-500 pb-2 mb-2 text-cyan-400 uppercase italic">Show Schedule</div>
                                <div className="flex flex-col gap-2">
                                    {t.items.map((it, i) => (
                                        <div key={i} className="flex flex-col border-r-4 border-cyan-400 pr-4">
                                            <span className="text-[14px] font-black text-white mirror-text-glow">{it.v}</span>
                                            <span className="text-[11px] font-bold text-yellow-300 mt-0.5">{it.t}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 2. WELCOME BANNER (深色抗眩光歡迎橫條) */}
                    <div className="mt-4 mb-2 border-l-4 border-cyan-400 pl-8 py-4 bg-black/80 rounded-r-3xl border border-white/10 shadow-2xl">
                        <div className="text-3xl font-black text-white tracking-[0.3em] uppercase mirror-text-glow">
                            {t.welcome}
                        </div>
                    </div>

                    {/* 3. VIDEO AREA (核心 5 片 YouTube 帶音訊輪播) */}
                    <div className="video-container-max">
                        <div className="video-overlay"></div>
                        <iframe 
                            className="w-full h-full border-none"
                            src="https://www.youtube-nocookie.com/embed/XnjQNAigtYE?autoplay=1&mute=0&loop=1&playlist=XnjQNAigtYE,mAbcJRE48VY,n2qsqUDseYI,liuk0tEsOEM,GdKKJTlKUkE&controls=0&modestbranding=1&rel=0&iv_load_policy=3&enablejsapi=1&origin=https://www.youtube.com"
                            allow="autoplay; encrypted-media" 
                            allowFullScreen
                        ></iframe>
                    </div>

                    {/* 4. MARQUEE AREA (動態跑馬燈) */}
                    <div className="marquee-safe-box">
                        <div className="animate-marquee">
                            {t.marquee.map((m, i) => (
                                <div key={i} className="flex items-center">
                                    <span className="text-2xl font-black text-white tracking-[0.1em] px-12 italic mirror-text-glow">{m}</span>
                                    <i data-lucide="sparkles" className="w-6 h-6 text-yellow-400"></i>
                                </div>
                            ))}
                            {t.marquee.map((m, i) => (
                                <div key={`rep-${i}`} className="flex items-center">
                                    <span className="text-2xl font-black text-white tracking-[0.1em] px-12 italic mirror-text-glow">{m}</span>
                                    <i data-lucide="sparkles" className="w-6 h-6 text-yellow-400"></i>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* 5. BOTTOM CONTROLS & STATS (現場高飽和度實心按鈕) */}
                    {}
                    <div className="flex flex-col gap-8">
                        <div className="flex justify-between items-end">
                            {/* 💡 燈光與音樂按鈕：更換為強對比實心亮色背底 */}
                            <div className="glass-panel flex gap-6 px-10 py-6">
                                <button 
                                    onClick={() => setLightOn(!lightOn)} 
                                    className={`w-24 h-24 btn-mirror rounded-[20px] flex flex-col items-center justify-center gap-2 ${
                                        lightOn ? 'btn-mirror-active-ctrl' : 'btn-mirror-inactive-ctrl'
                                    }`}
                                >
                                    <i data-lucide="lightbulb" className="w-8 h-8"></i>
                                    <span className="text-xs font-black uppercase">Light</span>
                                </button>
                                <button 
                                    onClick={handleMusic} 
                                    className={`w-24 h-24 btn-mirror rounded-[20px] flex flex-col items-center justify-center gap-2 ${
                                        musicOn ? 'btn-mirror-active-ctrl' : 'btn-mirror-inactive-ctrl'
                                    }`}
                                >
                                    <i data-lucide={musicOn ? "pause" : "play"} className="w-8 h-8"></i>
                                    <span className="text-xs font-black uppercase">Music</span>
                                </button>
                            </div>

                            {/* 💡 語言切換按鈕區：更換為強對比實心亮藍背底 */}
                            <div className="flex gap-4 glass-panel p-4">
                                {['tw', 'en'].map(c => (
                                    <button 
                                        key={c} 
                                        onClick={() => setLang(c)}
                                        className={`px-8 py-3 font-black text-lg rounded-[12px] btn-mirror ${
                                            lang === c ? 'btn-mirror-active-lang' : 'btn-mirror-inactive-lang'
                                        }`}
                                    >
                                        {c.toUpperCase()}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 💡 底部數據指標：修正跑版重疊，加入垂直分割線與大間距 */}
                        <div className="flex justify-center items-center gap-32 py-2">
                            <div className="text-center">
                                <div className="text-5xl font-black text-emerald-300 mirror-text-glow">12,480</div>
                                <div className="text-xs font-black text-white/90 tracking-widest mt-2 uppercase mirror-text-glow">{t.visitorsLabel}</div>
                            </div>
                            
                            {/* 實體白色半透明分割線：確保兩者絕不相撞 */}
                            <div className="h-16 w-[3px] bg-white/20 rounded-full"></div>
                            
                            <div className="text-center">
                                <div className="text-5xl font-black text-indigo-300 mirror-text-glow">100%</div>
                                <div className="text-xs font-black text-white/90 tracking-widest mt-2 uppercase mirror-text-glow">{t.uptimeLabel}</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function renderApp() {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        }
    </script>
</body>
</html>
